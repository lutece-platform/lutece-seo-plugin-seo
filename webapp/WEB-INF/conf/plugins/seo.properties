# seo.properties

################################################################################
# Daemon management

daemon.seoFriendlyUrlGenerator.interval=3600
daemon.seoFriendlyUrlGenerator.onstartup=1

daemon.seoSitemapGenerator.interval=3600
daemon.seoSitemapGenerator.onstartup=1

################################################################################
# Directory of the generated files, outside the webapp.
#
# The sitemap used to be written inside the webapp. A webapp is a build artefact,
# replaced at every deployment, so a generated file kept there is lost - and on a site
# shipping its own sitemap.xml, overwritten. It was also a path this plugin does not
# own : the sitemap plugin writes to <webapp>/sitemap.xml too, in hard code.
#
# The sitemap is now written to sitemap-seo.xml in the directory below, and served by
# SitemapServlet on /sitemap-seo.xml - the path to declare in the Sitemap directive of
# robots.txt. Since nothing outside this plugin serves that directory, it may live
# anywhere the webapp can write.
#
# Left undefined, a subdirectory of the system temporary directory is used : always
# writable, and harmless since the daemon rebuilds the sitemap every hour and the
# servlet generates it on demand when it is missing. Point this at a persistent volume
# to keep the sitemap across restarts.
#seo.generatedFilesPath=/data/lutece/seo
#
# Migration : remove any sitemap.xml or sitemap-seo.xml left at the webapp root. As
# long as one is there, every generation logs a reminder, because the web server keeps
# serving that frozen file to the search engines that discovered it.

################################################################################
# Sitemap - Base URL of the absolute URLs written to the sitemap.
#
# Taken from lutece.prod.url, a property of the core this plugin only reads : the
# site declares it per environment, in conf/override/config.properties. Left empty,
# the sitemap holds relative URLs, which search engines reject - every generation
# then logs an error.

################################################################################
# URL rewriting filter (seo_urlrewriter)
#
# These properties override the init parameters declared in WEB-INF/plugins/seo.xml.
# They are read through the configuration API of the core (MicroProfile Config), so the
# value may also be provided by a system property or an environment variable, for instance
# SEO_URLREWRITER_STATUSENABLED=true. An undefined or blank property keeps the value
# declared in the descriptor.
#
# Diagnostic page of the filter : displays the rewrite rules actually loaded in memory and
# their parsing errors, on <context-path>/status. Kept off by default, useful on a
# development environment when a friendly URL does not behave as expected.
# Beware : access is filtered on the Host header, not on the client address.
#seo.urlrewriter.statusEnabled=false
#seo.urlrewriter.statusPath=/status
#seo.urlrewriter.statusEnabledOnHosts=localhost
#
# Number of seconds between two checks of the rules file for reload
#seo.urlrewriter.confReloadCheckInterval=60
#
# TRACE, DEBUG, INFO, WARN, ERROR, FATAL, log4j, commons, sysout:{level}
#seo.urlrewriter.logLevel=WARN
