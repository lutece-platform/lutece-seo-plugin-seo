#######################################################################################################
# seo.properties
#######################################################################################################
# Config file path
seo.configFilePath=/WEB-INF/plugins/seo/urlrewrite.xml

################################################################################
# Daemon management
daemon.seoFriendlyUrlGenerator.interval=3600
daemon.seoFriendlyUrlGenerator.onstartup=1

daemon.seoSitemapGenerator.interval=3600
daemon.seoSitemapGenerator.onstartup=1

################################################################################
# Sitemap - Base URL for absolute URLs in sitemap.xml
%rec.lutece.prod.url=http://localhost:9090
%prod.lutece.prod.url=http://localhost:9090

################################################################################
# Sitemap - Change frequencies
sitemap.page.changefreq=weekly
sitemap.document.changefreq=weekly

################################################################################
# URL rewriting filter (seo_urlrewriter)
#
# These properties override the init parameters declared in WEB-INF/plugins/seo.xml.
# They are read through the configuration API of the core (MicroProfile Config), so the
# value may also be provided by a system property or an environment variable, for instance
# SEO_URLREWRITER_STATUSENABLED=true. An undefined or blank property keeps the value
# declared in the descriptor.
#
# Diagnostic page of the filter : displays the rewrite rules actually loaded in memory and
# their parsing errors, on <context-path>/status. Kept off by default, useful on a
# development environment when a friendly URL does not behave as expected.
# Beware : access is filtered on the Host header, not on the client address.
#seo.urlrewriter.statusEnabled=false
#seo.urlrewriter.statusPath=/status
#seo.urlrewriter.statusEnabledOnHosts=localhost
#
# Number of seconds between two checks of the rules file for reload
#seo.urlrewriter.confReloadCheckInterval=60
#
# TRACE, DEBUG, INFO, WARN, ERROR, FATAL, log4j, commons, sysout:{level}
#seo.urlrewriter.logLevel=WARN
