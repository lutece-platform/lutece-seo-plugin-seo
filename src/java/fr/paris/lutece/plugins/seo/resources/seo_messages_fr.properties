panel.friendly_urls.titleManageFriendlyUrls=Gestion des URL explicites
panel.friendly_urls.explainFriendlyUrls1=Le référencement est amélioré lorsque les URL des pages du site sont explicites, c'est à dire qu'elles contiennent que des termes lisibles et non techniques.
panel.friendly_urls.explainFriendlyUrls2=En utilisant la technique de réécriture d'URL, il est possible de définir des URL explicites et configurer leur redirection vers les URL techniques correspondantes. 
panel.friendly_urls.explainFriendlyUrls3=Les règles de redirection sont décrites dans un fichier qu'il convient de regénérer dès que des nouvelles règles ont été ajoutées.
panel.friendly_urls.buttonManageFriendlyUrls=Gérer les URL explicites
panel.friendly_urls.titleUpdateConfigFile=Mise à jour du fichier de configuration
panel.friendly_urls.labelFileIsUptodate=Le fichier de configuration des redirections est à jour !
panel.friendly_urls.labelFileIsNotUptodate=Le fichier de configuration des redirections n'est pas à jour !
panel.friendly_urls.buttonUpdateConfigFile=Mettre à jour
panel.friendly_urls.titleAutoGenerate=Automatisation de la génération des URL explicites
panel.friendly_urls.labelAutoGenerateEnabled=La génération automatique d'URL explicites pour les nouvelles ressources est activée.
panel.friendly_urls.buttonAutoGenerateDisable=Désactiver la génération automatique
panel.friendly_urls.labelAutoGenerateDisabled=La génération automatique d'URL explicites pour les nouvelles ressources n'est pas activée.
panel.friendly_urls.buttonAutoGenerateEnable=Activer la génération automatique
panel.friendly_urls.titleRewriteLinks=Réécriture des liens dans le contenu des pages
panel.friendly_urls.explainRewriteLinks=Lutece peut convertir à la volée les liens techniques contenus dans les pages par des liens utilisant des URL explicites. Cette fonctionnalité a un léger impact sur les performances. Elle ne doit être activée que si des URL explicites sont utilisées.
panel.friendly_urls.labelRewriteLinksEnabled=La réécriture des liens pour utiliser des URL explicites est activée.
panel.friendly_urls.buttonRewriteLinksDisable=Désactiver la réécriture
panel.friendly_urls.labelRewriteLinksDisabled=La réécriture des liens pour utiliser des URL explicites n'est pas activée.
panel.friendly_urls.buttonRewriteLinksEnable=Activer la réécriture
panel.friendly_urls.titleCanonicalUrls=URL canoniques basées sur les URL explicites
panel.friendly_urls.explainCanonicalUrls=Lorsque plusieurs URL renvoient le même contenu (URL technique et URL explicite par exemple), les moteurs de recherche souhaite conna&icirc;tre celle qui fait foi et s'assurer qu'il ne s'agit pas de contenu dupliqé. L'URL canonique permet de définir l'URL à prendre en compte par les moteurs.
panel.friendly_urls.linkCanonicalUrls=<a href="http://support.google.com/webmasters/bin/answer.py?hl=fr&answer=139394" title="Lien vers site Google" target="_blank">En savoir plus ... <i class="ti ti-external-link" alt="Lien externe : Url carnoniques" title="Url carnoniques [Nouvelle fenêtre]"></i></a>
panel.friendly_urls.canonicalUrlsEnabled=L'ajout de l'URL canonique dans la page est activée.
panel.friendly_urls.buttonCanonicalUrlsDisable=Désactiver l'insertion d'URL canoniques
panel.friendly_urls.canonicalUrlsDisabled=L'ajout de l'URL canonique dans la page n'est pas activée.
panel.friendly_urls.buttonCanonicalUrlsEnable=Activer l'insertion d'URL canoniques

panel.sitemap.titleManageSitemap=Gestion du fichier Sitemap
panel.sitemap.explainManageSitemap=Le ou les fichiers "sitemap" permettent aux webmasters d'indiquer facilement aux moteurs de recherche les pages de leurs sites à explorer. Les robots d'exploration peuvent extraire toutes les URL du plan Sitemap et de recueillir des informations sur ces URL à l'aide des métadonnées associées. 
panel.sitemap.labelMore=En savoir plus ... &nbsp;
panel.sitemap.buttonDisplaySitemap=Afficher le contenu du fichier        
panel.sitemap.titleGenerate=Génération automatique
panel.sitemap.buttonUpdateFile=Mettre à jour le fichier
panel.sitemap.labelStatus=Statut
panel.sitemap.explainGenerate=La mise à jour du fichier peut être automatisée à fréquence régulière
panel.sitemap.buttonDisableGenerate=Désactiver la mise à jour automatique
panel.sitemap.buttonEnableGenerate=Activer la mise à jour automatique
panel.sitemap.errorFileNotFound=Aucun fichier sitemap.xml trouvé. Veuillez le générer au préalable.

panel.url_rewriter_rules.titleManageRules=Gestion des réécritures d'URL génériques
panel.url_rewriter_rules.explainRules=La réecriture d'URL peut se faire également à l'aide de règles génériques (ex : une règle pour définir des URL courtes pour les pages '/p/{id}')
panel.url_rewriter_rules.warningRules=Attention, cette fonctionnalité utilise le même fichier de configuration que les redirections des URL explicites. Elle a plut\u00f4t vocation à être utilisée lorsque les URL explicites ne sont pas activées.
